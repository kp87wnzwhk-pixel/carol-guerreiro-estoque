<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e91e8c" />
  <title>Limpar cache — Carol Estoque</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 28px 20px; background: #fff8fb; color: #222; }
    h1 { color: #c2185b; font-size: 1.4rem; }
    button {
      display: block; width: 100%; margin-top: 16px; padding: 14px 16px;
      font-size: 1.1rem; border: 0; border-radius: 12px; background: #e91e8c; color: #fff;
    }
    p { line-height: 1.45; }
    #log { margin-top: 16px; font-size: 0.9rem; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Carol Estoque — limpar cache</h1>
  <p>Isso remove o Service Worker e o cache antigo que deixam a faixa em “Conectando nuvem…”.</p>
  <p>Seus cadastros na <strong>nuvem</strong> não são apagados. Só o cache deste Safari.</p>
  <button type="button" id="btn">Limpar e abrir o app</button>
  <div id="log">Toque no botão…</div>
  <script>
  function log(msg) {
    var el = document.getElementById('log');
    el.textContent = (el.textContent ? el.textContent + '\n' : '') + msg;
  }
  async function hardClean() {
    log('Limpando…');
    try {
      if (navigator.serviceWorker) {
        var regs = await navigator.serviceWorker.getRegistrations();
        log('Service workers: ' + regs.length);
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
      }
      if (window.caches) {
        var keys = await caches.keys();
        log('Caches: ' + keys.join(', ') || '(nenhum)');
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
      try {
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf('cgi_estoque_clean') === 0 || k.indexOf('cgi_estoque_force') === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      log('OK. Abrindo o app…');
      location.replace('./?v=15&reset=' + Date.now());
    } catch (e) {
      log('Erro: ' + (e && e.message ? e.message : e));
      alert('Falha ao limpar. Tente: Safari → Aa → Recarregar sem conteúdo / limpar dados do site.');
    }
  }
  document.getElementById('btn').onclick = hardClean;
  // auto após 1s se veio com ?auto=1
  if (/[?&]auto=1/.test(location.search)) {
    setTimeout(hardClean, 400);
  }
  </script>
</body>
</html>
